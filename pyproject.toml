[project]
name = "aegis-browser"
version = "0.1.0"
description = "General headless browser wrapper (Playwright) for Aegis and its skills"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["browser*"]
exclude = ["tests*", "extension*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
